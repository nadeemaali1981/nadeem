services:
  - type: web
    name: nadeem-accounting
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false   # set the value in the Render dashboard (Environment)
