[build]
  command = "npm install --omit=dev"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"

[functions]
  node_bundler = "esbuild"
  included_files = ["historical_data.js"]
  external_node_modules = ["pg-native"]

# All API calls go to the serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Single-page app fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
